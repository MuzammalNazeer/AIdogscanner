# ========================
# Server Configuration
# ========================
server.port=8081
server.address=0.0.0.0
spring.security.enabled=false
# ========================
# Spring Application Name
# ========================
spring.application.name=spring-dog-backend

# ========================
# Database Connection
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/petcare_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ========================
# Multipart File Upload
# ========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================
# CORS Configuration
# ========================
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=false
spring.main.allow-bean-definition-overriding=true
# For Spring Boot 2.x and 3.x - CORS configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
# ========================
# Logging Configuration
# ========================
logging.level.org.springframework.web=DEBUG
logging.level.spring_dog_backend=DEBUG
logging.level.org.springframework.web.cors=DEBUG
# Jackson configuration for enum handling
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.read-enums-using-to-string=true
spring.jackson.deserialization.read-unknown-enum-values-as-null=true
spring.jackson.property-naming-strategy=SNAKE_CASE
# ========================
# JWT CONFIG
# ========================
# JWT Configuration - MUST be at least 32 characters for HS256
jwt.secret=MySuperSecureJWTSecretKeyThatIsAtLeast32Chars!
jwt.expiration=86400000
jwt.expiration.week=604800000

# ============================================================================
# TESTING PROFILE
# ============================================================================
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true

# Hikari Connection Pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
# Use MySQL8Dialect instead of generic MySQLDialect






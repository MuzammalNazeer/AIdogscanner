server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: spring-dog-backend

  datasource:
    url: jdbc:mysql://localhost:3306/petcare_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

cors:
  allowed-origins: "*"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: false

logging:
  level:
    org.springframework.web: DEBUG
    spring_dog_backend: DEBUG
    org.springframework.web.cors: DEBUG

# ========================
# JWT CONFIGURATION
# ========================
jwt:
  secret: MySuperSecretKeyForJWTChangeThis123456789
  expiration: 3600000         # 1 hour
  expiration-day: 86400000    # 1 day
  expiration-week: 604800000  # 1 week



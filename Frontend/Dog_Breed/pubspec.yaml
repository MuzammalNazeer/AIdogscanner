name: dog_breed
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  provider: ^6.1.2
  fluttertoast: ^8.2.8
  http_parser: ^4.0.0
  http: ^0.13.4
  permission_handler: ^11.0.1
  another_flushbar: ^1.12.30
  shared_preferences: ^2.1.1
  flutter_screenutil: ^5.9.3
  tflite_flutter: ^0.9.5
  tflite_flutter_helper: ^0.2.1
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  get_it: ^7.6.7
  flutter_secure_storage: ^9.0.0
  localstorage: ^5.0.0
  flutter_hooks: ^0.18.0
  signature: ^5.5.0
  flutter_verification_code: ^1.1.7
  flutter_otp_text_field: ^1.2.0
  image: ^4.2.0
  flutter_spinkit: ^5.2.0
  pin_code_fields: ^8.0.1
  flutter_svg: ^2.0.7
  syncfusion_flutter_signaturepad: ^20.2.49-beta
  google_fonts: ^4.0.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  webview_flutter: ^4.10.0
  flutter_plugin_android_lifecycle: ^2.0.0
  percent_indicator: ^4.2.3
  flutter_launcher_icons: ^0.14.4
  camera: ^0.11.3
  path: ^1.9.0
  connectivity_plus: ^7.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4
dependency_overrides:
  image: ^3.2.2
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
flutter:

  uses-material-design: true
  assets:
    - assets/models/dog_identifier.tflite
    - assets/labels.txt
    - assets/training_history.json
    - assets/prediction_result.json
    - assets/images/
    - assets/fonts/
    - assets/icons/



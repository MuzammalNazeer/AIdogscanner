name: dog_breed
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+2

environment:
  sdk: ">=3.9.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  provider: ^6.1.2
  fluttertoast: ^9.0.0
  http_parser: ^4.0.0
  http: ^1.6.0
  permission_handler: ^11.0.1
  another_flushbar: ^1.12.30
  shared_preferences: ^2.1.1
  flutter_screenutil: ^5.9.3
  tflite_flutter: 0.9.5
  tflite_flutter_helper: ^0.2.1
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  get_it: ^7.6.7
  flutter_secure_storage: ^9.0.0
  localstorage: ^5.0.0
  flutter_hooks: ^0.18.0
  signature: ^5.5.0
  flutter_verification_code: ^1.1.7
  flutter_otp_text_field: ^1.2.0
  image: ^3.0.2
  flutter_spinkit: ^5.2.0
  pin_code_fields: ^8.0.1
  flutter_svg: ^2.0.7
  syncfusion_flutter_signaturepad: ^20.2.49-beta
  google_mobile_ads: ^5.0.0
  google_fonts: ^4.0.4
  url_launcher: ^6.2.3
  path_provider: ^2.1.4
  webview_flutter: ^4.10.0
  flutter_plugin_android_lifecycle: ^2.0.0
  percent_indicator: ^4.2.3
  flutter_launcher_icons: ^0.14.0
  camera: ^0.11.3
  video_player: ^2.8.6
  path: ^1.9.0
  flutter_native_splash: ^2.4.7
  connectivity_plus: ^5.0.2
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  edge_to_edge: ^0.0.2
  share_plus: ^7.2.0
  device_info_plus: ^9.0.3
  mailer: ^6.6.0
  emailjs: ^1.1.0
  table_calendar: ^3.0.9
  flutter_riverpod: ^2.4.9
  flutter_card_swiper: ^7.2.0
  flutter_slidable: ^3.0.1
  uuid: ^4.3.3
  timezone: ^0.10.0
  flutter_local_notifications: ^19.5.0
  file_picker: ^8.0.0
  open_file: ^3.3.1
  fl_chart: ^0.68.0
  intl_phone_number_input: ^0.7.4
  country_picker: ^2.0.20
  lottie: ^3.1.0
  dropdown_search: ^5.0.6
  dropdown_button2: ^2.3.9
  in_app_purchase: ^3.2.3
  flutter_switch: ^0.3.2
  video_player_win: ^3.2.2

dependency_overrides:
  tflite_flutter: ^0.9.5
  image: ^3.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.0
  build_runner: ^2.0.0
  hive_generator: ^2.0.0
# Removed dependency_overrides to avoid pinning incompatible versions
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/frame_412.png"

  flutter_native_splash:
    # Light mode
    color: "#820DFF"  # White background
    image: assets/splash/frame_412.png  # Your logo (dark colored)

    # Dark mode
    color_dark: "#820DFF"  # Dark background
    image_dark: assets/splash/frame_412.png  # White logo

    # Common settings
    android: true
flutter:

  generate: true

  uses-material-design: true
  assets:
    - assets/models/dog_identifier.tflite
    - assets/labels.txt
    - assets/training_history.json
    - assets/prediction_result.json
    - assets/images/
    - assets/fonts/
    - assets/animations/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora/Sora-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Sora/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora/Sora-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Bold.otf
          weight: 700
        - asset: assets/fonts/Inter/Inter-SemiBold.otf
          weight: 600
